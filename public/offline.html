<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F4D3A" />
    <title>لا يوجد اتصال — Gunited Travel</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fbf8f2;
        color: #14342a;
        font-family: "Cairo", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card {
        max-width: 420px;
        width: 100%;
        background: #fffdf8;
        border: 1px solid #ece3d2;
        border-radius: 20px;
        padding: 32px 24px;
        box-shadow: 0 18px 40px -24px rgba(31, 77, 58, 0.4);
      }
      .badge {
        width: 72px;
        height: 72px;
        margin: 0 auto 18px;
        border-radius: 20px;
        background: #1f4d3a;
        display: grid;
        place-items: center;
      }
      .badge img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 20px; margin: 0 0 8px; color: #1f4d3a; }
      p { font-size: 14px; line-height: 1.7; color: #5d6b62; margin: 0 0 6px; }
      .en { color: #8b9790; font-size: 13px; }
      button {
        margin-top: 22px;
        width: 100%;
        border: 0;
        border-radius: 12px;
        padding: 13px 18px;
        background: #1f4d3a;
        color: #fbf8f2;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
      button:active { background: #14342a; }
      .gold { height: 3px; width: 56px; margin: 18px auto 0; background: #c9a063; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge"><img src="/icons/icon-192.png" alt="Gunited Travel" /></div>
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>تعذّر تحميل هذه الصفحة. تحقّق من الشبكة ثم أعد المحاولة.</p>
      <p class="en">You're offline. Check your connection and try again.</p>
      <button onclick="location.reload()">إعادة المحاولة / Retry</button>
      <div class="gold"></div>
    </div>
  </body>
</html>
